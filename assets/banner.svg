<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-label="Terminal: Accepted x 322, competitive programming solutions in C++17" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <clipPath id="c1"><rect x="44" y="76" height="36" width="360">
      <animate attributeName="width" dur="7s" begin="0s" fill="freeze" calcMode="linear" keyTimes="0;0.0286;0.2286;1" values="0;0;360;360"/>
    </rect></clipPath>
    <clipPath id="c3"><rect x="44" y="160" height="36" width="440">
      <animate attributeName="width" dur="7s" begin="0s" fill="freeze" calcMode="linear" keyTimes="0;0.4286;0.6286;1" values="0;0;440;440"/>
    </rect></clipPath>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f6feb" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#a371f7" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <!-- window -->
  <rect x="20" y="15" width="960" height="310" rx="14" fill="#0d1117" stroke="#30363d"/>
  <rect x="20" y="15" width="960" height="310" rx="14" fill="url(#glow)"/>
  <path d="M20 55H980" stroke="#30363d"/>
  <circle cx="48" cy="35" r="7" fill="#ff5f56"/>
  <circle cx="72" cy="35" r="7" fill="#ffbd2e"/>
  <circle cx="96" cy="35" r="7" fill="#27c93f"/>
  <text x="500" y="40" text-anchor="middle" font-family="Consolas,'SFMono-Regular','Courier New',monospace" font-size="13" fill="#8b949e">cp-solutions — zsh</text>

  <g font-family="Consolas,'SFMono-Regular','Courier New',monospace">
    <!-- command 1 (typed) -->
    <g clip-path="url(#c1)">
      <text x="50" y="102" font-size="22"><tspan fill="#79c0ff">cp-solutions</tspan><tspan fill="#8b949e"> $ </tspan><tspan fill="#f0f6fc">cat README</tspan></text>
    </g>

    <!-- output 1 -->
    <text x="50" y="136" font-size="20" fill="#c9d1d9" opacity="1">Competitive programming solutions in C++17
      <animate attributeName="opacity" dur="7s" begin="0s" fill="freeze" keyTimes="0;0.2571;0.3143;1" values="0;0;1;1"/>
    </text>

    <!-- command 2 (typed) -->
    <g clip-path="url(#c3)">
      <text x="50" y="186" font-size="22"><tspan fill="#79c0ff">cp-solutions</tspan><tspan fill="#8b949e"> $ </tspan><tspan fill="#f0f6fc">./verdicts --all</tspan></text>
    </g>

    <!-- big verdict -->
    <g opacity="1">
      <animate attributeName="opacity" dur="7s" begin="0s" fill="freeze" keyTimes="0;0.6571;0.7143;1" values="0;0;1;1"/>
      <circle cx="66" cy="224" r="16" fill="#238636"/>
      <path d="M58 224l6 6 11-13" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="96" y="234" font-size="34" font-weight="700" fill="#3fb950">Accepted × 322</text>
    </g>

    <!-- breakdown -->
    <text x="50" y="268" font-size="16" fill="#8b949e" opacity="1">
      <animate attributeName="opacity" dur="7s" begin="0s" fill="freeze" keyTimes="0;0.7143;0.7714;1" values="0;0;1;1"/>
      <tspan fill="#4f9bff">Codeforces 254</tspan> · <tspan fill="#3fb950">CSES 32</tspan> · <tspan fill="#a371f7">Toph 24</tspan> · <tspan fill="#d29922">AtCoder 10</tspan> · <tspan fill="#e8873a">LeetCode 2</tspan>
    </text>

    <!-- prompt + blinking cursor -->
    <g opacity="1">
      <animate attributeName="opacity" dur="7s" begin="0s" fill="freeze" keyTimes="0;0.8286;0.8857;1" values="0;0;1;1"/>
      <text x="50" y="306" font-size="22"><tspan fill="#79c0ff">cp-solutions</tspan><tspan fill="#8b949e"> $ </tspan></text>
      <rect x="248" y="288" width="12" height="22" fill="#c9d1d9">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
