<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-label="Codeforces ladder: Div. 1 10, Div. 2 119, Div. 3 70, Div. 4 42, Others 23" xmlns:c2pa="http://c2pa.org/manifest">
<rect x="0.5" y="0.5" width="999" height="389" rx="20" fill="#0d1117" stroke="#30363d"/>
<text font-family="Consolas,'SFMono-Regular','Courier New',monospace" x="40" y="62" font-size="12" letter-spacing="3" fill="#8b949e">CODEFORCES LADDER</text>
<text font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" x="40" y="108" font-size="32" font-weight="800" fill="#f0f6fc">One rung</text>
<text font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" x="40" y="146" font-size="32" font-weight="800" fill="#f0f6fc">at a time.</text>
<text font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" x="40" y="222" font-size="14" fill="#8b949e">Div. 1 problems come from</text>
<text font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" x="40" y="244" font-size="14" fill="#8b949e">combined rounds, so they also</text>
<text font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" x="40" y="266" font-size="14" fill="#8b949e">sit in the Div. 2 folder.</text>
<text font-family="Consolas,'SFMono-Regular','Courier New',monospace" x="40" y="318" font-size="14" fill="#c9d1d9">264 folders</text>
<text font-family="Consolas,'SFMono-Regular','Courier New',monospace" x="40" y="340" font-size="14" fill="#c9d1d9">254 unique problems</text>
<text font-family="Consolas,'SFMono-Regular','Courier New',monospace" x="300" y="106" font-size="16" fill="#c9d1d9">Div. 1</text>
